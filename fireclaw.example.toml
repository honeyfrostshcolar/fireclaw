# FireClaw 配置文件示例
# 复制为 fireclaw.toml 并填入你的实际值
# CLI 参数会覆盖配置文件中的值

[server]
host = "0.0.0.0"
port = 8766
data_dir = "./data"
adapter = "simulator"          # simulator | ros1
# ros1_config = "ros1.yaml"   # ROS1 适配器配置路径

[planner]
type = "deterministic"         # deterministic | llm

# LLM Provider 配置（当 planner.type = "llm" 时使用）
[provider]
base_url = "https://api.deepseek.com/v1"
api_key = "sk-your-key-here"
model = "deepseek-chat"

# Robot-Local Agent 配置
[robot_agent]
enabled = true
planner = "llm"                # deterministic | llm

# Robot Agent 的 LLM 配置（不填则复用 [provider]）
[robot_agent.provider]
# base_url = "https://api.deepseek.com/v1"
# api_key = "sk-your-key-here"
# model = "deepseek-chat"
