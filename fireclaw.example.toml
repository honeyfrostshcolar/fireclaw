# FireClaw 配置文件示例
# 复制为 fireclaw.toml 并填入你的实际值
# CLI 参数会覆盖配置文件中的值
#
# 机器人身份、适配器、ROS 配置、存储路径等从 profile 自动派生。
# 维护 examples/robot_profiles/<robot>.toml 即可，无需在此重复。

[server]
host = "0.0.0.0"
port = 8766
data_dir = "./data/mission"

[planner]
type = "deterministic"         # deterministic | llm

# LLM Provider 配置（当 planner.type = "llm" 或 robot_agent.planner = "llm" 时使用）
[provider]
base_url = ""
api_key = ""
model = ""

# Mission 配置 — 从 robot profiles 构建 robot registry
[mission]
robot_profiles = ["examples/robot_profiles/gazebo_turtlebot3.toml"]

# Robot-Local Gateway 配置
# robot_id, adapter, ros1_config, memory_path, event_path, task_queue_path
# 均从 profile_path 自动派生，无需手动指定
[robot_gateway]
host = "127.0.0.1"
port = 8765
profile_path = "examples/robot_profiles/gazebo_turtlebot3.toml"
workspace_skills_dir = "skills"
# dry_run = true means robot-local execution records ROS1 commands without sending them.
# Use CLI --real-run only when ROS/Gazebo or robot hardware is ready.
dry_run = true
default_session_id = "default"
max_active_execution_tasks = 1

# Robot-Local Agent 配置
[robot_agent]
enabled = true
planner = "llm"                # deterministic | llm

# Robot Agent 的 LLM 配置（不填则复用 [provider]）
[robot_agent.provider]
# base_url = "https://api.deepseek.com/v1"
# api_key = "sk-your-key-here"
# model = "deepseek-chat"
