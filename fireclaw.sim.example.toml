# SIMULATION ONLY — FireClaw Gazebo 配置模板
# 复制为私有的 fireclaw.sim.toml 后再填写 Provider；不要改成 real 模式，
# 也不要把这份配置复制到真实机器人。CLI 参数会覆盖配置文件中的值。

# FireClaw changes into this canonical directory before either long-running
# Gateway is assembled. Relative config paths are resolved from here.
# When omitted, the directory containing this config file is used.
[runtime]
root_dir = "."

# The same root fireclaw.sim.toml is also the Robot capability and Plugin Runtime
# deployment Profile. Robot-specific ROS launch files stay with the robot;
# navigation composition and default algorithm parameters stay in the Plugin.
[robot]
id = "gazebo_turtlebot3"
base_url = "http://127.0.0.1:8765"
adapter = "ros1"
# Robot Profile filesystem paths are resolved relative to this TOML file,
# independently of the directory from which the Gateway is launched.
ros1_config = "examples/ros1_configs/gazebo_turtlebot3_move_base.yaml"
data_dir = "data/robots/gazebo_turtlebot3"
capabilities = ["navigation", "patrol", "emergency_stop"]
enabled_skills = ["navigate_to_point"]
llm_exposed_skills = ["navigate_to_point"]
primitive_skills = ["navigate_to_point"]

[capability_skill_chains]
navigation = ["navigate_to_point"]
patrol = ["navigate_to_point"]

[robot.sensor_discovery]
enabled = true
message_timeout_seconds = 2.0

[[robot.sensor_discovery.rules]]
topic_pattern = "/scan"
message_type = "sensor_msgs/LaserScan"
sensor = "lidar"
confidence = 0.99
confirmed = true

[server]
host = "127.0.0.1"
port = 8766
data_dir = "./data/mission"
# Required before changing host to 0.0.0.0 or another non-loopback address.
# Prefer FIRECLAW_GATEWAY_TOKEN in deployed environments.
# api_token = "replace-with-a-random-secret"

# Remote listeners must use TLS. Keep this disabled only while binding to
# 127.0.0.1/::1 for local development.
[server.tls]
enabled = false
# cert_file = "certs/mission-gateway.crt"
# key_file = "certs/mission-gateway.key"
# ca_file = "certs/fireclaw-ca.crt"
# require_client_cert = true

# Shared admission limits for both Mission and Robot Gateway listeners.
[network]
max_body_bytes = 1048576
request_header_timeout_seconds = 10
body_read_timeout_seconds = 10
max_connections = 128
max_connections_per_ip = 32
auth_max_failures = 10
auth_window_seconds = 60
auth_lockout_seconds = 300
auth_exempt_loopback = true
auth_max_tracked_clients = 10000
max_sse_connections = 16
max_sse_connections_per_ip = 4
sse_queue_size = 256
sse_write_timeout_seconds = 10
# Required for wildcard listener binds such as 0.0.0.0. List hostnames or IPs,
# without URL paths; ports are checked against the actual listener port.
# allowed_hosts = ["mission.example.internal", "robot-1.example.internal"]
# Browser Origins are denied unless same-origin or explicitly listed here.
# allowed_origins = ["https://operator-console.example.internal"]

[planner]
type = "deterministic"         # deterministic | llm

# LLM Provider 配置（当 planner.type = "llm" 或 robot_agent.planner = "llm" 时使用）
[provider]
name = ""                    # stable provider identity recorded in evaluations
base_url = ""
api_key = ""
api_key_env = "FIRECLAW_PROVIDER_API_KEY"
model = ""
thinking = false                 # MiMo 深度思考：false 关闭，true 开启
timeout_seconds = 60
# catalog = "models.json"  # context_window, max_tokens, optional tokenizer_id

# LLM Tool 权限由可信宿主执行。本样板只对应 TurtleBot3 仿真。
# 实机必须从 fireclaw.real.example.toml 重新创建配置，禁止修改本字段切换模式。
[deployment]
id = "gazebo-turtlebot3-burger"
mode = "simulation"

[deployment.ros1]
distro = "noetic"
setup_files = [
  "/opt/ros/noetic/setup.bash",
  "robots/turtlebot3_burger/ros_ws/devel/setup.bash",
]

[deployment.launch]
# Only robot hardware/simulation, drivers, sensors, odometry and base TF.
robot_launch = "robots/turtlebot3_burger/ros_ws/src/fireclaw_turtlebot3_burger/launch/robot_base.launch"

[deployment.bindings.navigation]
# Required robot/map bindings consumed by the Plugin-owned generic launch.
map_file = "robots/turtlebot3_burger/ros_ws/src/turtlebot3/turtlebot3_navigation/maps/map.yaml"
scan_topic = "/scan"
scan_frame = "base_scan"
cmd_vel_topic = "/cmd_vel"
odom_topic = "/odom"
map_frame = "map"
odom_frame = "odom"
base_frame = "base_footprint"
footprint = [
  [-0.105, -0.105],
  [-0.105, 0.105],
  [0.041, 0.105],
  [0.041, -0.105],
]

# Measured physical limits and localization/sensor characteristics.
max_linear_velocity = 0.22
max_angular_velocity = 2.75
max_lateral_velocity = 0.0
min_translational_velocity = 0.11
min_angular_velocity = 1.37
max_linear_acceleration = 2.5
max_angular_acceleration = 3.2
max_lateral_acceleration = 0.0
allow_reverse = true
laser_max_range = 3.5
odom_model_type = "diff"
odom_alpha1 = 0.1
odom_alpha2 = 0.1
odom_alpha3 = 0.1
odom_alpha4 = 0.1

# Map/environment tuning and the simulation's deterministic start pose.
obstacle_range = 3.0
raytrace_range = 3.5
inflation_radius = 1.0
cost_scaling_factor = 3.0
initial_pose_x = -2.0
initial_pose_y = -0.5
initial_pose_yaw = 0.0

[deployment.tools.mission_agent]
allow = ["group:computer"]
deny = [
  "group:host_admin",
  "group:credential_access",
  "group:real_hardware",
]

[deployment.tools.robot_agent]
allow = ["group:computer"]
deny = [
  "group:host_admin",
  "group:credential_access",
  "group:real_hardware",
]

[deployment.sandbox.mission_agent]
enabled = false
backend = "docker"
workspace_root = "data/mission/agent-workspace"
image = "fireclaw-agent-sim:local"
# Required before enabled=true. Obtain with:
# docker image inspect --format '{{.Id}}' fireclaw-agent-sim:local
# image_digest = "sha256:replace-with-64-hex-image-id"
network = "none"
max_timeout_seconds = 30
max_output_chars = 20000
max_output_bytes = 64000
memory_mb = 512
cpus = 1.0
pids_limit = 128
max_file_bytes = 2097152
max_workspace_bytes = 67108864
max_workspace_files = 4096
max_concurrent_processes = 1

[deployment.sandbox.robot_agent]
enabled = false
backend = "docker"
workspace_root = "data/robot/agent-workspace"
image = "fireclaw-agent-sim:local"
# Required before enabled=true. Obtain with:
# docker image inspect --format '{{.Id}}' fireclaw-agent-sim:local
# image_digest = "sha256:replace-with-64-hex-image-id"
network = "none"
max_timeout_seconds = 30
max_output_chars = 20000
max_output_bytes = 64000
memory_mb = 512
cpus = 1.0
pids_limit = 128
max_file_bytes = 2097152
max_workspace_bytes = 67108864
max_workspace_files = 4096
max_concurrent_processes = 1

[mission]
robot_profiles = ["fireclaw.sim.toml"]
group_timeout_seconds = 720
planning_timeout_seconds = 180
embodied_runtime_mode = "simulation"
# Token presented by Mission Agent when connecting to Robot Gateways.
# Prefer FIRECLAW_ROBOT_GATEWAY_TOKEN when all robots share one operator secret.
# robot_gateway_api_token = "replace-with-the-robot-gateway-secret"

# Trust and optional mTLS identity used by Mission Agent when calling Robot
# Gateways. HTTPS always verifies the certificate hostname.
[mission.robot_gateway_tls]
# ca_file = "certs/fireclaw-ca.crt"
# cert_file = "certs/mission-gateway-client.crt"
# key_file = "certs/mission-gateway-client.key"

# OpenClaw-shaped extension discovery. FireClaw reads manifests and invokes
# each enabled extension's declared entrypoint; plugin-specific fields stay
# under the manifest ID and are not interpreted by Gateway core.
[plugins]
paths = ["extensions"]
selected = ["fireclaw.navigation.move-base"]

[plugins.config."fireclaw.navigation.move-base"]
enabled = true
navigate_timeout_seconds = 360
# real_mutation_enabled = false
# real_mutable_parameters = ["dwa/max_vel_x"]

# External firefighting knowledge used to ground the LLM mission planner.
# Rebuild indexes after running the RAG prepare-index pipeline so records carry
# source_kind = "external_knowledge".
#[mission.knowledge_rag]
#backend = "bm25"  # bm25 | dense | hybrid | hybrid_rerank
#bm25_index_dir = "/srv/lpp-extra/fireclaw/indexes/fire-knowledge/bm25"
#dense_index_dir = "/srv/lpp-extra/fireclaw/indexes/fire-knowledge/dense"
#embedding_provider = "bge-m3"
#embedding_model_path = "/srv/lpp-extra/fireclaw/models/bge-m3"
#device = "cuda"
#candidate_multiplier = 3
#rrf_k = 60

# Robot-Local Gateway 配置
[robot_gateway]
host = "127.0.0.1"
port = 8765
# Required before binding the Robot Gateway outside loopback.
# api_token = "replace-with-a-random-secret"
profile_path = "fireclaw.sim.toml"
dry_run = false
default_session_id = "default"
max_active_execution_tasks = 1
embodied_runtime_mode = "simulation"
embodied_memory_path = "data/robots/gazebo_turtlebot3/embodied-memory.jsonl"
embodied_memory_index = "data/robots/gazebo_turtlebot3/embodied-memory-index.sqlite3"
# Navigation Plugin: simulation exposes the finite move_base tuning catalog.
# Real mode hides bounded tuning by default; enabling it still requires exact
# operator approval and the listed parameter names.
# runtime_state_path = "data/robot/runtime.sqlite3"

[robot_gateway.tls]
enabled = false
# cert_file = "certs/robot-1.crt"
# key_file = "certs/robot-1.key"
# ca_file = "certs/fireclaw-ca.crt"
# require_client_cert = true

# Robot-Local Agent 配置
[robot_agent]
enabled = true
planner = "llm"                # deterministic | llm
loop_timeout_seconds = 600

# Robot Agent 的 LLM 配置（不填则复用 [provider]）
[robot_agent.provider]
# base_url = "https://api.deepseek.com/v1"
# api_key = "sk-your-key-here"
# model = "deepseek-chat"
# catalog = "robot-models.json"  # defaults to [provider].catalog
