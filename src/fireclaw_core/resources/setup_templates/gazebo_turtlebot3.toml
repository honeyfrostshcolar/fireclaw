# Generated by `fireclaw setup` from a credential-free simulation template.
# Do not change deployment.mode to real; create and review a separate real Profile.

[fireclaw.setup]
schema_version = 1
template_id = "gazebo-turtlebot3-burger-v1"
mode = "simulation"
bundle_id = {{BUNDLE_ID}}
bundle_version = {{BUNDLE_VERSION}}
bundle_sha256 = {{BUNDLE_SHA256}}
bundle_root = {{BUNDLE_ROOT}}
workspace_fingerprint = {{WORKSPACE_FINGERPRINT}}

[runtime]
root_dir = {{WORKSPACE_ROOT}}

[robot]
id = "gazebo_turtlebot3"
base_url = "http://127.0.0.1:8765"
adapter = "ros1"
ros1_config = {{ROS1_CONFIG}}
data_dir = {{ROBOT_DATA_DIR}}
capabilities = ["navigation", "patrol", "emergency_stop"]
enabled_skills = ["navigate_to_point"]
llm_exposed_skills = ["navigate_to_point"]
primitive_skills = ["navigate_to_point"]

[capability_skill_chains]
navigation = ["navigate_to_point"]
patrol = ["navigate_to_point"]

[robot.sensor_discovery]
enabled = true
message_timeout_seconds = 2.0

[[robot.sensor_discovery.rules]]
topic_pattern = "/scan"
message_type = "sensor_msgs/LaserScan"
sensor = "lidar"
confidence = 0.99
confirmed = true

[server]
host = "127.0.0.1"
port = 8766
data_dir = {{MISSION_DATA_DIR}}

[server.tls]
enabled = false

[planner]
type = "deterministic"

[deployment]
id = "gazebo-turtlebot3-burger"
mode = "simulation"
output_root = {{DEPLOYMENT_OUTPUT_ROOT}}

[deployment.ros1]
distro = "noetic"
setup_files = [{{ROS_SETUP}}, {{ROBOT_WS_SETUP}}]

[deployment.launch]
robot_launch = {{ROBOT_LAUNCH}}

[deployment.bindings.navigation]
map_file = {{MAP_FILE}}
scan_topic = "/scan"
scan_frame = "base_scan"
cmd_vel_topic = "/cmd_vel"
odom_topic = "/odom"
map_frame = "map"
odom_frame = "odom"
base_frame = "base_footprint"
footprint = [
  [-0.105, -0.105],
  [-0.105, 0.105],
  [0.041, 0.105],
  [0.041, -0.105],
]
max_linear_velocity = 0.22
max_angular_velocity = 2.75
max_lateral_velocity = 0.0
min_translational_velocity = 0.11
min_angular_velocity = 1.37
max_linear_acceleration = 2.5
max_angular_acceleration = 3.2
max_lateral_acceleration = 0.0
allow_reverse = true
laser_max_range = 3.5
odom_model_type = "diff"
odom_alpha1 = 0.1
odom_alpha2 = 0.1
odom_alpha3 = 0.1
odom_alpha4 = 0.1
obstacle_range = 3.0
raytrace_range = 3.5
inflation_radius = 1.0
cost_scaling_factor = 3.0
initial_pose_x = -2.0
initial_pose_y = -0.5
initial_pose_yaw = 0.0

[deployment.tools.mission_agent]
allow = ["group:computer"]
deny = ["group:host_admin", "group:credential_access", "group:real_hardware"]

[deployment.tools.robot_agent]
allow = ["group:computer"]
deny = ["group:host_admin", "group:credential_access", "group:real_hardware"]

[deployment.sandbox.mission_agent]
enabled = false
backend = "docker"
workspace_root = {{MISSION_WORKSPACE}}
image = "fireclaw-agent-sim:local"
network = "none"
max_timeout_seconds = 30
max_output_chars = 20000
max_output_bytes = 64000
memory_mb = 512
cpus = 1.0
pids_limit = 128
max_file_bytes = 2097152
max_workspace_bytes = 67108864
max_workspace_files = 4096
max_concurrent_processes = 1

[deployment.sandbox.robot_agent]
enabled = false
backend = "docker"
workspace_root = {{ROBOT_WORKSPACE}}
image = "fireclaw-agent-sim:local"
network = "none"
max_timeout_seconds = 30
max_output_chars = 20000
max_output_bytes = 64000
memory_mb = 512
cpus = 1.0
pids_limit = 128
max_file_bytes = 2097152
max_workspace_bytes = 67108864
max_workspace_files = 4096
max_concurrent_processes = 1

[mission]
robot_profiles = [{{PROFILE_PATH}}]
embodied_runtime_mode = "simulation"
group_timeout_seconds = 720
planning_timeout_seconds = 180

[mission.robot_gateway_tls]

[plugins]
paths = [{{PLUGIN_ROOT}}]
selected = ["fireclaw.navigation.move-base"]

[plugins.config."fireclaw.navigation.move-base"]
enabled = true
navigate_timeout_seconds = 360

[robot_gateway]
host = "127.0.0.1"
port = 8765
profile_path = {{PROFILE_PATH}}
dry_run = true
default_session_id = "default"
max_active_execution_tasks = 1

[robot_gateway.tls]
enabled = false

[robot_agent]
enabled = true
planner = "deterministic"
loop_timeout_seconds = 600
