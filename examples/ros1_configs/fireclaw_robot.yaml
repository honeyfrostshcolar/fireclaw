# FireClaw firefighting robot ROS1 config template
# Domain runtime endpoints belong to their Plugins; this file configures only
# the core robot state/fail-safe boundary and shared diagnostics.
robot_id: "firebot_01"
namespace: "/fireclaw/firebot_01"
transport:
  enabled: true
  wait_for_server_seconds: 10.0
  wait_for_result_seconds: 60.0
emergency_stop:
  interface: service
  name: "/emergency_stop"
  type: "std_srvs/Trigger"
