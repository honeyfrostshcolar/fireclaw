[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireclaw"
version = "0.1.0"
description = "Embodied agent framework for firefighting robot planning, tools, safety, and ROS integration."
readme = "AGENTS.zh-CN.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy==1.26.4",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
fireclaw = "fireclaw_core.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]
rag = [
  "FlagEmbedding==1.4.0",
  "huggingface-hub==0.36.2",
  "torch==2.8.0",
  "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fireclaw_core.resources.setup_templates" = ["*.toml"]
"fireclaw_core.resources.simulation_bundles" = ["*.json"]
"fireclaw_core.web_console" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ros1_smoke: requires running ROS1 master (roscore + turtlesim + actionlib_tutorials)",
    "gazebo_acceptance: requires the fixed TurtleBot3 Gazebo acceptance environment and explicit opt-in",
]
