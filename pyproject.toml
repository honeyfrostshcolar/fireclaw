[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireclaw"
version = "0.1.0"
description = "Python dry-run core for FireClaw firefighting robot agents."
readme = "AGENTS.zh-CN.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
fireclaw = "fireclaw_core.mission_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ros1_smoke: requires running ROS1 master (roscore + turtlesim + actionlib_tutorials)",
]

