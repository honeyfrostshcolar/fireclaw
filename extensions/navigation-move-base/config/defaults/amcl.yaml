# Robot/map bindings (frames, odometry model, range and noise) are injected by
# fireclaw_navigation.launch. These are conservative algorithm defaults.
min_particles: 500
max_particles: 3000
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.20
update_min_a: 0.20
resample_interval: 1
transform_tolerance: 0.5
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
gui_publish_rate: 10.0
save_pose_rate: 0.5
tf_broadcast: true

laser_min_range: -1.0
laser_max_beams: 60
laser_z_hit: 0.5
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.5
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_likelihood_max_dist: 2.0
laser_model_type: likelihood_field
