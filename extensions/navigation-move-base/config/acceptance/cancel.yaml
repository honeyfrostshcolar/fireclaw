schema_version: fireclaw.gazebo-acceptance/v1
scenario_id: turtlebot3-move-base-cancel
scenario_type: cancel
description: >-
  A fixed single-floor navigation goal cancelled by the Mission control plane
  after live progress, proving acknowledged stop and canonical cancellation
  propagation through the Plugin-owned ROS1 move_base path.
seed: 0

robot:
  id: gazebo_turtlebot3
  model: burger
  initial_pose:
    frame_id: map
    x: -2.0
    y: -0.5
    yaw: 0.0

mission:
  command: "导航测试到坐标 (2.0, 0.0)，收到操作员取消时立即安全停止"
  capability: patrol
  required_tool: navigate_to_point

goal:
  frame_id: map
  x: 2.0
  y: 0.0
  yaw: 0.0

expected:
  plugin_owner: fireclaw.navigation.move-base
  backend_class: Ros1MoveBaseBackend
  action_name: /move_base
  mission_authorization_status: awaiting_confirmation
  mission_authorization_raw_status: awaiting_confirmation
  terminal_status: cancelled
  actionlib_terminal_statuses: [2, 8]

assertions:
  minimum_displacement_m: 1.0
  initial_position_tolerance_m: 0.20
  initial_yaw_tolerance_rad: 0.35
  position_tolerance_m: 0.25
  yaw_tolerance_rad: 0.35
  stopped_linear_velocity_mps: 0.02
  stopped_angular_velocity_rps: 0.05
  require_feedback: true

cancellation:
  minimum_feedback_count: 1
  minimum_displacement_m: 0.15
  observation_timeout_seconds: 45.0
  acknowledgement_timeout_seconds: 5.0
  maximum_post_cancel_displacement_m: 0.50

timeouts:
  ros_readiness_seconds: 90.0
  navigation_seconds: 120.0
  mission_seconds: 180.0
  stopped_seconds: 5.0

readiness:
  action_server: /move_base
  topics:
    - /clock
    - /scan
    - /odom
  transforms:
    - [map, base_link]

assets:
  launch: extensions/navigation-move-base/launch/fireclaw_acceptance_world.launch
  world: robots/turtlebot3_burger/ros_ws/src/turtlebot3_simulations/turtlebot3_gazebo/worlds/turtlebot3_world.world
  map: robots/turtlebot3_burger/ros_ws/src/turtlebot3/turtlebot3_navigation/maps/map.yaml
  map_image: robots/turtlebot3_burger/ros_ws/src/turtlebot3/turtlebot3_navigation/maps/map.pgm
  ros1_config: examples/ros1_configs/gazebo_turtlebot3_move_base.yaml
