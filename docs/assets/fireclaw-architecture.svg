<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560" role="img" aria-labelledby="title desc">
  <title id="title">FireClaw system architecture</title>
  <desc id="desc">A simple five-step flow from a human operator to mission planning, robot safety, plugin tools, and the robot runtime, with one feedback and audit channel.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1480" height="560" rx="24" fill="#f8fafc"/>
  <rect x="1" y="1" width="1478" height="558" rx="23" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="64" fill="#0f172a" font-size="30" font-weight="750">从自然语言任务到可验证的机器人动作</text>
    <text x="70" y="96" fill="#64748b" font-size="18">From operator intent to safe, observable execution</text>

    <!-- Step 1: Operator -->
    <g transform="translate(70 150)">
      <rect width="240" height="180" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
      <circle cx="36" cy="36" r="19" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="36" y="43" fill="#c2410c" font-size="20" font-weight="750" text-anchor="middle">1</text>
      <text x="68" y="43" fill="#0f172a" font-size="23" font-weight="750">操作员</text>
      <text x="24" y="88" fill="#334155" font-size="18">自然语言任务</text>
      <text x="24" y="120" fill="#64748b" font-size="16">确认关键计划</text>
      <text x="24" y="150" fill="#64748b" font-size="16">查看状态与结果</text>
    </g>

    <!-- Step 2: Mission Agent -->
    <g transform="translate(345 150)">
      <rect width="240" height="180" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
      <circle cx="36" cy="36" r="19" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
      <text x="36" y="43" fill="#0369a1" font-size="20" font-weight="750" text-anchor="middle">2</text>
      <text x="68" y="43" fill="#0f172a" font-size="23" font-weight="750">Mission Agent</text>
      <text x="24" y="88" fill="#334155" font-size="18">理解与澄清意图</text>
      <text x="24" y="120" fill="#64748b" font-size="16">生成任务图</text>
      <text x="24" y="150" fill="#64748b" font-size="16">选择机器人与策略</text>
    </g>

    <!-- Step 3: Robot Agent and Safety -->
    <g transform="translate(620 150)">
      <rect width="240" height="180" rx="18" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
      <circle cx="36" cy="36" r="19" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
      <text x="36" y="43" fill="#b45309" font-size="20" font-weight="750" text-anchor="middle">3</text>
      <text x="68" y="43" fill="#0f172a" font-size="22" font-weight="750">Robot Agent</text>
      <text x="24" y="88" fill="#334155" font-size="18">SafetyGate 检查</text>
      <text x="24" y="120" fill="#64748b" font-size="16">状态 · 权限 · 风险</text>
      <text x="24" y="150" fill="#64748b" font-size="16">不确定时拒绝执行</text>
    </g>

    <!-- Step 4: Plugin boundary -->
    <g transform="translate(895 150)">
      <rect width="240" height="180" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="36" cy="36" r="19" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="36" y="43" fill="#6d28d9" font-size="20" font-weight="750" text-anchor="middle">4</text>
      <text x="68" y="43" fill="#0f172a" font-size="23" font-weight="750">Plugin</text>
      <text x="24" y="88" fill="#334155" font-size="18">Skill + typed Tool</text>
      <text x="24" y="120" fill="#64748b" font-size="16">校验 Tool 输入</text>
      <text x="24" y="150" fill="#64748b" font-size="16">Adapter 转换调用</text>
    </g>

    <!-- Step 5: Runtime -->
    <g transform="translate(1170 150)">
      <rect width="240" height="180" rx="18" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <circle cx="36" cy="36" r="19" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <text x="36" y="43" fill="#047857" font-size="20" font-weight="750" text-anchor="middle">5</text>
      <text x="68" y="43" fill="#0f172a" font-size="23" font-weight="750">Robot Runtime</text>
      <text x="24" y="88" fill="#334155" font-size="18">ROS · Gazebo · SDK</text>
      <text x="24" y="120" fill="#64748b" font-size="16">执行物理动作</text>
      <text x="24" y="150" fill="#64748b" font-size="16">返回传感器与终态</text>
    </g>

    <!-- Main flow arrows -->
    <path d="M318 240 H334" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M593 240 H609" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M868 240 H884" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1143 240 H1159" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Feedback channel -->
    <rect x="190" y="402" width="1100" height="92" rx="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
    <text x="235" y="439" fill="#0f172a" font-size="20" font-weight="750">执行反馈与证据</text>
    <text x="235" y="469" fill="#475569" font-size="17">Execution Monitor</text>
    <circle cx="465" cy="457" r="4" fill="#94a3b8"/>
    <text x="490" y="469" fill="#475569" font-size="17">Memory</text>
    <circle cx="625" cy="457" r="4" fill="#94a3b8"/>
    <text x="650" y="469" fill="#475569" font-size="17">Audit Log</text>
    <circle cx="795" cy="457" r="4" fill="#94a3b8"/>
    <text x="820" y="469" fill="#475569" font-size="17">Progress / Retry / Terminal Evidence</text>

    <path d="M1290 338 V383 H740 V393" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#feedbackArrow)"/>
    <path d="M190 448 H120 V340 H170" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#feedbackArrow)"/>
    <text x="80" y="393" fill="#64748b" font-size="15" font-weight="650">状态回传</text>
  </g>
</svg>
