<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">FireClaw mission-to-motion system architecture</title>
  <desc id="desc">Layered architecture from a human operator through mission planning, robot safety, plugin tools, trusted adapters, robot runtime, and the cross-cutting evidence plane.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1628"/>
      <stop offset="1" stop-color="#10172d"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="operatorPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e2438"/>
      <stop offset="1" stop-color="#10283f"/>
    </linearGradient>
    <linearGradient id="missionPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2534"/>
      <stop offset="1" stop-color="#101f3c"/>
    </linearGradient>
    <linearGradient id="robotPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151d3b"/>
      <stop offset="1" stop-color="#201936"/>
    </linearGradient>
    <linearGradient id="runtimePanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102a2b"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <linearGradient id="evidencePanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17213b"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1440" height="920" rx="28" fill="url(#background)"/>
  <rect width="1440" height="920" rx="28" fill="url(#grid)"/>
  <circle cx="1320" cy="80" r="150" fill="#7c3aed" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="110" cy="820" r="150" fill="#0ea5e9" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Header -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="58" y="48" width="13" height="54" rx="6.5" fill="url(#titleGradient)"/>
    <text x="92" y="76" fill="#f8fafc" font-size="28" font-weight="750" letter-spacing="0.2">FireClaw System Architecture</text>
    <text x="92" y="102" fill="#94a3b8" font-size="15" letter-spacing="1.4">MISSION → SAFETY → MOTION → EVIDENCE</text>

    <g transform="translate(1030 55)">
      <rect width="108" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.48"/>
      <circle cx="18" cy="16" r="4" fill="#38bdf8"/>
      <text x="31" y="21" fill="#bae6fd" font-size="12" font-weight="650">CONTROL</text>
      <rect x="120" width="104" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.48"/>
      <circle cx="138" cy="16" r="4" fill="#a78bfa"/>
      <text x="151" y="21" fill="#ddd6fe" font-size="12" font-weight="650">PLUGIN</text>
      <rect x="236" width="116" height="32" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.48"/>
      <circle cx="254" cy="16" r="4" fill="#34d399"/>
      <text x="267" y="21" fill="#a7f3d0" font-size="12" font-weight="650">RUNTIME</text>
    </g>
  </g>

  <!-- Layer panels -->
  <g filter="url(#shadow)">
    <rect x="58" y="136" width="982" height="128" rx="22" fill="url(#operatorPanel)" stroke="#38bdf8" stroke-opacity="0.22"/>
    <rect x="58" y="286" width="982" height="168" rx="22" fill="url(#missionPanel)" stroke="#22d3ee" stroke-opacity="0.22"/>
    <rect x="58" y="476" width="982" height="168" rx="22" fill="url(#robotPanel)" stroke="#a78bfa" stroke-opacity="0.24"/>
    <rect x="58" y="690" width="982" height="170" rx="22" fill="url(#runtimePanel)" stroke="#34d399" stroke-opacity="0.24"/>
    <rect x="1064" y="136" width="318" height="724" rx="22" fill="url(#evidencePanel)" stroke="#64748b" stroke-opacity="0.32"/>
  </g>

  <!-- Layer labels -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">
    <text x="82" y="160" fill="#7dd3fc">OPERATOR EXPERIENCE</text>
    <text x="82" y="310" fill="#67e8f9">MISSION CONTROL PLANE</text>
    <text x="82" y="500" fill="#c4b5fd">ROBOT EXECUTION PLANE</text>
    <text x="82" y="714" fill="#6ee7b7">PHYSICAL RUNTIME</text>
    <text x="1090" y="166" fill="#cbd5e1">CROSS-CUTTING</text>
  </g>

  <!-- Operator layer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(100 174)">
      <rect width="280" height="68" rx="16" fill="#111f31" stroke="#38bdf8" stroke-opacity="0.42"/>
      <circle cx="35" cy="34" r="18" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.7"/>
      <path d="M29 36c0-4 2.7-7 6-7s6 3 6 7M35 27a4 4 0 1 0 0-8 4 4 0 0 0 0 8" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="30" fill="#f8fafc" font-size="17" font-weight="700">Human Operator</text>
      <text x="66" y="51" fill="#94a3b8" font-size="12.5">自然语言目标 · 显式确认</text>
    </g>
    <g transform="translate(485 174)">
      <rect width="500" height="68" rx="16" fill="#111f31" stroke="#38bdf8" stroke-opacity="0.42"/>
      <circle cx="35" cy="34" r="18" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.7"/>
      <rect x="27" y="26" width="16" height="13" rx="2" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <path d="M31 44h8M35 39v5" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="30" fill="#f8fafc" font-size="17" font-weight="700">Operator Interfaces</text>
      <text x="66" y="51" fill="#94a3b8" font-size="12.5">CLI · TUI · Rescue Ops Web Console</text>
      <g transform="translate(356 20)" font-size="10.5" font-weight="650" text-anchor="middle">
        <rect width="42" height="27" rx="8" fill="#0ea5e9" fill-opacity="0.15"/>
        <text x="21" y="18" fill="#bae6fd">CLI</text>
        <rect x="48" width="42" height="27" rx="8" fill="#0ea5e9" fill-opacity="0.15"/>
        <text x="69" y="18" fill="#bae6fd">TUI</text>
        <rect x="96" width="48" height="27" rx="8" fill="#0ea5e9" fill-opacity="0.15"/>
        <text x="120" y="18" fill="#bae6fd">WEB</text>
      </g>
    </g>
    <path d="M388 208 H468" fill="none" stroke="#38bdf8" stroke-width="2.3" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- Mission control cards -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(92 332)">
      <rect width="196" height="94" rx="16" fill="#0c1b2d" stroke="#22d3ee" stroke-opacity="0.45"/>
      <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.18"/>
      <text x="28" y="33" fill="#67e8f9" font-size="13" font-weight="800" text-anchor="middle">1</text>
      <text x="52" y="29" fill="#f8fafc" font-size="15" font-weight="700">NL Interface</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11.5">Normalize intent</text>
      <text x="20" y="77" fill="#94a3b8" font-size="11.5">Clarify unsafe ambiguity</text>
    </g>
    <g transform="translate(326 332)">
      <rect width="196" height="94" rx="16" fill="#0c1b2d" stroke="#22d3ee" stroke-opacity="0.45"/>
      <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.18"/>
      <text x="28" y="33" fill="#67e8f9" font-size="13" font-weight="800" text-anchor="middle">2</text>
      <text x="52" y="29" fill="#f8fafc" font-size="15" font-weight="700">Mission Agent</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11.5">Plan · assign · revise</text>
      <text x="20" y="77" fill="#94a3b8" font-size="11.5">No direct ROS access</text>
    </g>
    <g transform="translate(560 332)">
      <rect width="196" height="94" rx="16" fill="#151833" stroke="#a78bfa" stroke-opacity="0.55"/>
      <circle cx="28" cy="28" r="14" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="28" y="33" fill="#c4b5fd" font-size="13" font-weight="800" text-anchor="middle">3</text>
      <text x="52" y="29" fill="#f8fafc" font-size="15" font-weight="700">Sealed Plan</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11.5">Task graph + policy</text>
      <text x="20" y="77" fill="#94a3b8" font-size="11.5">Digest-bound confirmation</text>
    </g>
    <g transform="translate(794 332)">
      <rect width="214" height="94" rx="16" fill="#0c1b2d" stroke="#22d3ee" stroke-opacity="0.45"/>
      <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.18"/>
      <text x="28" y="33" fill="#67e8f9" font-size="13" font-weight="800" text-anchor="middle">4</text>
      <text x="52" y="29" fill="#f8fafc" font-size="15" font-weight="700">Mission Gateway</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11.5">Session · queue · scheduler</text>
      <text x="20" y="77" fill="#94a3b8" font-size="11.5">Fleet dispatch + trace</text>
    </g>
    <path d="M296 379 H317" fill="none" stroke="#38bdf8" stroke-width="2.1" marker-end="url(#arrowCyan)"/>
    <path d="M530 379 H551" fill="none" stroke="#38bdf8" stroke-width="2.1" marker-end="url(#arrowCyan)"/>
    <path d="M764 379 H785" fill="none" stroke="#a78bfa" stroke-width="2.1" marker-end="url(#arrowPurple)"/>
    <path d="M735 242 V286 H190 V323" fill="none" stroke="#38bdf8" stroke-width="2.1" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- Robot execution cards -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(92 522)">
      <rect width="196" height="94" rx="16" fill="#14192f" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="20" y="31" fill="#f8fafc" font-size="15" font-weight="700">Robot Gateway</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11.5">Robot-local control plane</text>
      <text x="20" y="77" fill="#94a3b8" font-size="11.5">Identity · events · auth</text>
    </g>
    <g transform="translate(326 522)">
      <rect width="196" height="94" rx="16" fill="#14192f" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="20" y="31" fill="#f8fafc" font-size="15" font-weight="700">Robot Agent</text>
      <text x="20" y="58" fill="#94a3b8" font-size="11.5">Observe · reason · act</text>
      <text x="20" y="77" fill="#94a3b8" font-size="11.5">Bounded local loop</text>
    </g>
    <g transform="translate(560 522)">
      <rect width="196" height="94" rx="16" fill="#2a1d21" stroke="#fb923c" stroke-opacity="0.75"/>
      <circle cx="169" cy="24" r="7" fill="#fb923c"/>
      <text x="20" y="31" fill="#fed7aa" font-size="15" font-weight="750">Safety Gate</text>
      <text x="20" y="58" fill="#d6b89e" font-size="11.5">Policy · authorization</text>
      <text x="20" y="77" fill="#d6b89e" font-size="11.5">Fail closed on uncertainty</text>
    </g>
    <g transform="translate(794 522)">
      <rect width="214" height="94" rx="16" fill="#1b1733" stroke="#a78bfa" stroke-opacity="0.65"/>
      <text x="20" y="31" fill="#ede9fe" font-size="15" font-weight="700">Plugin Host</text>
      <text x="20" y="58" fill="#aaa0c7" font-size="11.5">Skill workflow</text>
      <text x="20" y="77" fill="#aaa0c7" font-size="11.5">Plugin-owned typed Tool</text>
    </g>
    <path d="M296 569 H317" fill="none" stroke="#a78bfa" stroke-width="2.1" marker-end="url(#arrowPurple)"/>
    <path d="M530 569 H551" fill="none" stroke="#a78bfa" stroke-width="2.1" marker-end="url(#arrowPurple)"/>
    <path d="M764 569 H785" fill="none" stroke="#fb923c" stroke-width="2.1" marker-end="url(#arrowPurple)"/>
    <path d="M901 426 V466 H190 V513" fill="none" stroke="#a78bfa" stroke-width="2.1" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- Physical boundary -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M82 667 H1016" stroke="#fb923c" stroke-opacity="0.34" stroke-width="1.3" stroke-dasharray="7 8"/>
    <rect x="365" y="654" width="340" height="26" rx="13" fill="#171827" stroke="#fb923c" stroke-opacity="0.35"/>
    <text x="535" y="672" fill="#fdba74" font-size="10.5" font-weight="700" letter-spacing="1.35" text-anchor="middle">PHYSICAL SIDE-EFFECT BOUNDARY</text>
  </g>

  <!-- Runtime cards -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(118 748)">
      <rect width="238" height="84" rx="16" fill="#102329" stroke="#34d399" stroke-opacity="0.52"/>
      <text x="20" y="30" fill="#ecfdf5" font-size="15" font-weight="700">Trusted Adapter</text>
      <text x="20" y="55" fill="#8fbab1" font-size="11.5">Validate + translate Tool calls</text>
      <text x="20" y="73" fill="#8fbab1" font-size="11.5">Platform isolation boundary</text>
    </g>
    <g transform="translate(430 748)">
      <rect width="238" height="84" rx="16" fill="#102329" stroke="#34d399" stroke-opacity="0.52"/>
      <text x="20" y="30" fill="#ecfdf5" font-size="15" font-weight="700">Runtime / Algorithm</text>
      <text x="20" y="55" fill="#8fbab1" font-size="11.5">ROS 1 · move_base · Gazebo</text>
      <text x="20" y="73" fill="#8fbab1" font-size="11.5">Simulator · vendor SDK</text>
    </g>
    <g transform="translate(742 748)">
      <rect width="238" height="84" rx="16" fill="#17232c" stroke="#fb7185" stroke-opacity="0.55"/>
      <text x="20" y="30" fill="#fff1f2" font-size="15" font-weight="700">Robot + Environment</text>
      <text x="20" y="55" fill="#c9a9ae" font-size="11.5">Actuators · sensors · E-stop</text>
      <text x="20" y="73" fill="#c9a9ae" font-size="11.5">Uncertain physical world</text>
    </g>
    <path d="M901 616 V710 H237 V739" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
    <path d="M364 790 H421" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
    <path d="M676 790 H733" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Evidence plane -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="1090" y="196" fill="#f8fafc" font-size="21" font-weight="750">Evidence Plane</text>
    <text x="1090" y="220" fill="#94a3b8" font-size="12.5">Local-first · auditable · replayable</text>

    <g transform="translate(1090 254)">
      <rect width="266" height="142" rx="18" fill="#111d32" stroke="#38bdf8" stroke-opacity="0.3"/>
      <circle cx="28" cy="28" r="13" fill="#0ea5e9" fill-opacity="0.18"/>
      <path d="M23 28h10M23 24h10M23 32h7" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round"/>
      <text x="51" y="33" fill="#e0f2fe" font-size="15" font-weight="700">Memory &amp; Audit</text>
      <text x="22" y="65" fill="#94a3b8" font-size="11.5">• tasks + plans</text>
      <text x="22" y="87" fill="#94a3b8" font-size="11.5">• observations + decisions</text>
      <text x="22" y="109" fill="#94a3b8" font-size="11.5">• Tool calls + outcomes</text>
      <text x="22" y="131" fill="#94a3b8" font-size="11.5">• operator corrections</text>
    </g>

    <g transform="translate(1090 420)">
      <rect width="266" height="142" rx="18" fill="#171a31" stroke="#a78bfa" stroke-opacity="0.35"/>
      <circle cx="28" cy="28" r="13" fill="#8b5cf6" fill-opacity="0.2"/>
      <path d="M22 29l4 4 8-10" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="33" fill="#ede9fe" font-size="15" font-weight="700">Execution Monitor</text>
      <text x="22" y="65" fill="#a9a3bd" font-size="11.5">• progress + timeout</text>
      <text x="22" y="87" fill="#a9a3bd" font-size="11.5">• retry + recovery policy</text>
      <text x="22" y="109" fill="#a9a3bd" font-size="11.5">• cancellation + stop evidence</text>
      <text x="22" y="131" fill="#a9a3bd" font-size="11.5">• degraded-network handling</text>
    </g>

    <g transform="translate(1090 586)">
      <rect width="266" height="142" rx="18" fill="#10262a" stroke="#34d399" stroke-opacity="0.35"/>
      <circle cx="28" cy="28" r="13" fill="#10b981" fill-opacity="0.18"/>
      <path d="M21 28h14M30 23l5 5-5 5" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="33" fill="#d1fae5" font-size="15" font-weight="700">Feedback &amp; Proof</text>
      <text x="22" y="65" fill="#8fbab1" font-size="11.5">• live status + telemetry</text>
      <text x="22" y="87" fill="#8fbab1" font-size="11.5">• action feedback</text>
      <text x="22" y="109" fill="#8fbab1" font-size="11.5">• terminal result</text>
      <text x="22" y="131" fill="#8fbab1" font-size="11.5">• incident reconstruction</text>
    </g>

    <rect x="1090" y="756" width="266" height="74" rx="17" fill="#241c21" stroke="#fb923c" stroke-opacity="0.4"/>
    <text x="1223" y="783" fill="#fed7aa" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">SAFETY INVARIANT</text>
    <text x="1223" y="807" fill="#fdba74" font-size="12.5" text-anchor="middle">No evidence → no success claim</text>

    <path d="M1008 379 H1078" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#arrowSlate)"/>
    <path d="M1008 569 H1078" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#arrowSlate)"/>
    <path d="M980 790 H1078" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 6" marker-end="url(#arrowSlate)"/>

    <path d="M1223 244 V232 H1018 V208 H994" fill="none" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrowCyan)"/>
    <text x="1135" y="238" fill="#7dd3fc" font-size="10.5" font-weight="650" text-anchor="middle">STATUS PROJECTION</text>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="58" y="893" fill="#64748b" font-size="11.5">FireClaw keeps planning, authorization, physical execution, and evidence as explicit boundaries.</text>
    <text x="1382" y="893" fill="#475569" font-size="11" text-anchor="end">Research prototype · safety-first by design</text>
  </g>
</svg>
